name: Deployment Validation

on:
  workflow_dispatch:
    inputs:
      recovery_cycles:
        description: 'Repeated clean-bootstrap, rolling-restart and transaction recovery drills (1-5)'
        default: '1'
        required: true
        type: choice
        options: ['1', '2', '3', '4', '5']
  pull_request:
    paths:
      - '.github/workflows/deployment-validation.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'cmd/**'
      - 'pkg/**'
      - 'sdk/**'
      - 'util/**'
      - 'manifests/helm/**'
      - 'test/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  helm-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - uses: azure/setup-helm@v4
      - name: Install pinned kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Compile isolated SDK fixture
        run: go test -count=1 ./test/helm-runtime
      - name: Build broker and SDK fixture images
        run: |
          docker build -t cursus:helm-runtime .
          docker build -f test/helm-runtime/Dockerfile -t cursus-helm-smoke:runtime .
      - name: Verify secure standalone and cluster PVC recovery on Kubernetes
        run: bash test/helm-runtime/run.sh

  extended-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - name: Repeat durable recovery drills
        env:
          RECOVERY_CYCLES: ${{ inputs.recovery_cycles }}
          RUN_E2E_CHAOS: '1'
          RUN_E2E_ROLLING_RESTART: '1'
        run: |
          [[ "$RECOVERY_CYCLES" =~ ^[1-5]$ ]] || exit 1
          for ((cycle=1; cycle<=RECOVERY_CYCLES; cycle++)); do
            go test -v -count=1 -timeout 20m ./test/e2e-cluster -run '^Test(CleanBootstrapRollingRestartRestoresFullISR|ChaosTransactionCoordinatorRestartPreservesAtomicVisibility|ChaosLeaderFailoverRetryAndOffsetDurability)$'
          done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - name: Validate standalone and cluster chart contracts
        run: go test -v -count=1 ./test/helm
      - name: Lint and render standalone chart
        run: |
          helm lint manifests/helm
          helm template cursus manifests/helm > /tmp/cursus.yaml
          if grep -q '<base64-encoded' /tmp/cursus.yaml; then
            echo 'rendered chart contains placeholder credentials'
            exit 1
          fi
      - name: Reject unsafe deployment overrides
        run: |
          if helm template cursus manifests/helm --set replicaCount=2; then
            echo 'chart unexpectedly accepted more than one standalone replica'
            exit 1
          fi
          if helm template cursus manifests/helm --set tls.enabled=true --set tls.certPath=/tmp/cert.pem; then
            echo 'chart unexpectedly accepted a TLS certificate path outside the mounted Secret'
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build production image without publishing
        run: docker build --tag cursus:pr-validation .

  cluster-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - name: Run hard-kill transaction and offset recovery
        env:
          RUN_E2E_CHAOS: '1'
        run: go test -v -count=1 -timeout 25m ./test/e2e-cluster -run '^TestChaos(TransactionCoordinatorRestartPreservesAtomicVisibility|LeaderFailoverRetryAndOffsetDurability)$'
      - name: Show cluster logs on failure
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Clean cluster environment
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml down -v --remove-orphans
