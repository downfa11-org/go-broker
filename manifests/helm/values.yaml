replicaCount: 1
mode: standalone
production: false
shutdownTimeoutMS: 30000
networkPolicy:
  enabled: false
  clientPodSelector:
    cursus-client: "true"
  monitoringNamespaceSelector: {}
  monitoringPodSelector:
    cursus-monitoring: "true"

cluster:
  domain: cluster.local
  raftPort: 9001
  discoveryPort: 8000
  internalPort: 19000
  internalSecretName: ""
  internalTLSSecretName: ""
  minInSyncReplicas: 2

authentication:
  enabled: false
  secretName: ""

limits:
  maxClientConnections: 128
  maxStreamConnections: 128
  clientIdleTimeoutMS: 60000
  maxInFlightRequests: 16
  maxRequestBytes: 67108864
  maxInternalInFlightRequests: 32
  maxInternalRequestBytes: 134217728

image:
  repository: ghcr.io/cursus-io/cursus
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9000
  healthPort: 9080
  metricsPort: 9100

persistence:
  enabled: true
  storageClass: ""
  config:
    path: /app/config.yaml
    size: 1Gi
  logDir:
    path: /data/logs
    size: 10Gi

tls:
  enabled: false
  secretName: cursus-tls
  certPath: /app/tls/cert.pem
  keyPath: /app/tls/key.pem

podSecurityContext:
  fsGroup: 1000
  supplementalGroups: [1000]
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""

logLevel: info
broker:
  config:
    logLevel: {}

nodeSelector: {}
affinity: {}
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
tolerations: []
terminationGracePeriodSeconds: 60
startupProbeFailureThreshold: 300


monitoring:
  enabled: false
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  rules:
    enabled: false

performanceProfile: balanced  
  
performance:  
  custom: {} 
  
  low-latency:  
    diskFlushBatchSize: 50  
    lingerMS: 10  
    channelBufferSize: 1000  
    partitionChannelBufSize: 2000  
    consumerChannelBufSize: 500  
      
  balanced:  
    diskFlushBatchSize: 500  
    lingerMS: 100  
    channelBufferSize: 1024  
    partitionChannelBufSize: 10000  
    consumerChannelBufSize: 1000  
      
  high-throughput:  
    diskFlushBatchSize: 2000  
    lingerMS: 500  
    channelBufferSize: 50000  
    partitionChannelBufSize: 50000  
    consumerChannelBufSize: 5000
