{{- include "cursus.validate" . }}
{{- if .Values.tls.enabled }}
{{- if ne .Values.tls.certPath "/app/tls/cert.pem" }}
{{- fail "tls.certPath must be /app/tls/cert.pem because the TLS Secret is mounted at /app/tls" }}
{{- end }}
{{- if ne .Values.tls.keyPath "/app/tls/key.pem" }}
{{- fail "tls.keyPath must be /app/tls/key.pem because the TLS Secret is mounted at /app/tls" }}
{{- end }}
{{- end }}
apiVersion: apps/v1  
kind: {{ if eq .Values.mode "cluster" }}StatefulSet{{ else }}Deployment{{ end }}
metadata:  
  name: {{ include "cursus.fullname" . }}  
  labels:  
    {{- include "cursus.labels" . | nindent 4 }}  
spec:  
  replicas: {{ .Values.replicaCount }}  
  {{- if eq .Values.mode "cluster" }}
  serviceName: {{ include "cursus.fullname" . }}-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  volumeClaimTemplates:
    - metadata:
        name: logs
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.logDir.size }}
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:  
    matchLabels:  
      {{- include "cursus.selectorLabels" . | nindent 6 }}  
  template:  
    metadata:  
      labels:  
        {{- include "cursus.selectorLabels" . | nindent 8 }}  
      annotations:  
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}  
    spec:  
      automountServiceAccountToken: false
      serviceAccountName: {{ include "cursus.serviceAccountName" . }}  
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:  
        {{- toYaml .Values.podSecurityContext | nindent 8 }}  
      containers:  
        - name: {{ .Chart.Name }}  
          securityContext:  
            {{- toYaml .Values.securityContext | nindent 12 }}  
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"  
          imagePullPolicy: {{ .Values.image.pullPolicy }}  
          ports:  
            - name: broker  
              containerPort: {{ .Values.service.port }}  
              protocol: TCP  
            - name: health  
              containerPort: {{ .Values.service.healthPort }}  
              protocol: TCP  
            - name: metrics  
              containerPort: {{ .Values.service.metricsPort }}  
              protocol: TCP  
            {{- if eq .Values.mode "cluster" }}
            - name: raft
              containerPort: {{ .Values.cluster.raftPort }}
            - name: discovery
              containerPort: {{ .Values.cluster.discoveryPort }}
            - name: internal
              containerPort: {{ .Values.cluster.internalPort }}
            {{- end }}
          env:  
            - name: CONFIG_PATH  
              value: {{ .Values.persistence.config.path }}  
            - name: BROKER_PORT  
              value: "{{ .Values.service.port }}"  
            - name: HEALTH_CHECK_PORT  
              value: "{{ .Values.service.healthPort }}"  
            - name: EXPORTER_PORT  
              value: "{{ .Values.service.metricsPort }}"  
            - name: LOG_LEVEL  
              value: {{ .Values.logLevel | quote }}  
            - name: LOG_DIR  
              value: {{ .Values.persistence.logDir.path }}  
            {{- if .Values.authentication.enabled }}
            - name: ENABLE_SASL
              value: "true"
            - name: SASL_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentication.secretName }}
                  key: users.json
            {{- end }}
            {{- if eq .Values.mode "cluster" }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ADVERTISED_HOST
              value: "$(POD_NAME).{{ include "cursus.fullname" . }}-headless.{{ .Release.Namespace }}.svc.{{ .Values.cluster.domain }}"
            - name: ADVERTISED_CLIENT_HOST
              value: "$(ADVERTISED_HOST)"
            - name: INTERNAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.internalSecretName }}
                  key: token
            {{- else }}
            - name: ADVERTISED_CLIENT_HOST
              value: "{{ include "cursus.fullname" . }}.{{ .Release.Namespace }}.svc.{{ .Values.cluster.domain }}"
            {{- end }}
            {{- if .Values.tls.enabled }}  
            - name: USE_TLS
              value: "true"
            - name: TLS_CERT_PATH  
              value: {{ .Values.tls.certPath }}  
            - name: TLS_KEY_PATH  
              value: {{ .Values.tls.keyPath }}  
            {{- end }}  
          startupProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: {{ .Values.startupProbeFailureThreshold }}

          livenessProbe:
            httpGet:  
              path: /live
              port: health  
            initialDelaySeconds: 30  
            periodSeconds: 10  
            timeoutSeconds: 5  
            failureThreshold: 3  
          readinessProbe:  
            httpGet:  
              path: /ready
              port: health  
            initialDelaySeconds: 5  
            periodSeconds: 5  
            timeoutSeconds: 3  
            failureThreshold: 3  
          volumeMounts:  
            - name: logs  
              mountPath: {{ .Values.persistence.logDir.path }}  
            - name: config  
              mountPath: {{ .Values.persistence.config.path }}  
              subPath: config.yaml  
            {{- if .Values.tls.enabled }}  
            - name: tls  
              mountPath: /app/tls
              readOnly: true  
            {{- end }}  
            {{- if eq .Values.mode "cluster" }}
            - name: internal-tls
              mountPath: /app/internal-tls
              readOnly: true
            {{- end }}
          resources:  
            {{- toYaml .Values.resources | nindent 12 }}  
      volumes:  
        {{- if ne .Values.mode "cluster" }}
        - name: logs  
          {{- if .Values.persistence.enabled }}  
          persistentVolumeClaim:  
            claimName: {{ include "cursus.fullname" . }}-logs  
          {{- else }}  
          emptyDir: {}  
          {{- end }}  
        {{- end }}
        - name: config  
          configMap:  
            name: {{ include "cursus.fullname" . }}-config  
        {{- if .Values.tls.enabled }}  
        - name: tls  
          secret:  
            secretName: {{ .Values.tls.secretName }}  
            items:  
              - key: tls.crt  
                path: cert.pem  
              - key: tls.key  
                path: key.pem  
        {{- end }}  
        {{- if eq .Values.mode "cluster" }}
        - name: internal-tls
          secret:
            secretName: {{ .Values.cluster.internalTLSSecretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}  
      nodeSelector:  
        {{- toYaml . | nindent 8 }}  
      {{- end }}  
      {{- if eq .Values.mode "cluster" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "cursus.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- else }}
      {{- with .Values.affinity }}
      affinity:  
        {{- toYaml . | nindent 8 }}  
      {{- end }}  
      {{- end }}
      {{- with .Values.tolerations }}  
      tolerations:  
        {{- toYaml . | nindent 8 }}  
      {{- end }}
