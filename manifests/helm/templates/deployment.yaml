{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "the Deployment chart supports exactly one standalone replica; use an explicit distributed StatefulSet topology for clustering" }}
{{- end }}
{{- if .Values.tls.enabled }}
{{- if ne .Values.tls.certPath "/app/tls/cert.pem" }}
{{- fail "tls.certPath must be /app/tls/cert.pem because the TLS Secret is mounted at /app/tls" }}
{{- end }}
{{- if ne .Values.tls.keyPath "/app/tls/key.pem" }}
{{- fail "tls.keyPath must be /app/tls/key.pem because the TLS Secret is mounted at /app/tls" }}
{{- end }}
{{- end }}
apiVersion: apps/v1  
kind: Deployment  
metadata:  
  name: {{ include "cursus.fullname" . }}  
  labels:  
    {{- include "cursus.labels" . | nindent 4 }}  
spec:  
  replicas: {{ .Values.replicaCount }}  
  strategy:
    type: Recreate
  selector:  
    matchLabels:  
      {{- include "cursus.selectorLabels" . | nindent 6 }}  
  template:  
    metadata:  
      labels:  
        {{- include "cursus.selectorLabels" . | nindent 8 }}  
      annotations:  
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}  
    spec:  
      serviceAccountName: {{ include "cursus.serviceAccountName" . }}  
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:  
        {{- toYaml .Values.podSecurityContext | nindent 8 }}  
      containers:  
        - name: {{ .Chart.Name }}  
          securityContext:  
            {{- toYaml .Values.securityContext | nindent 12 }}  
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"  
          imagePullPolicy: {{ .Values.image.pullPolicy }}  
          ports:  
            - name: broker  
              containerPort: {{ .Values.service.port }}  
              protocol: TCP  
            - name: health  
              containerPort: {{ .Values.service.healthPort }}  
              protocol: TCP  
            - name: metrics  
              containerPort: {{ .Values.service.metricsPort }}  
              protocol: TCP  
          env:  
            - name: CONFIG_PATH  
              value: {{ .Values.persistence.config.path }}  
            - name: BROKER_PORT  
              value: "{{ .Values.service.port }}"  
            - name: HEALTH_CHECK_PORT  
              value: "{{ .Values.service.healthPort }}"  
            - name: EXPORTER_PORT  
              value: "{{ .Values.service.metricsPort }}"  
            - name: LOG_LEVEL  
              value: {{ .Values.logLevel | quote }}  
            - name: LOG_DIR  
              value: {{ .Values.persistence.logDir.path }}  
            {{- if .Values.tls.enabled }}  
            - name: USE_TLS
              value: "true"
            - name: TLS_CERT_PATH  
              value: {{ .Values.tls.certPath }}  
            - name: TLS_KEY_PATH  
              value: {{ .Values.tls.keyPath }}  
            {{- end }}  
          startupProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: {{ .Values.startupProbeFailureThreshold }}

          livenessProbe:
            httpGet:  
              path: /live
              port: health  
            initialDelaySeconds: 30  
            periodSeconds: 10  
            timeoutSeconds: 5  
            failureThreshold: 3  
          readinessProbe:  
            httpGet:  
              path: /ready
              port: health  
            initialDelaySeconds: 5  
            periodSeconds: 5  
            timeoutSeconds: 3  
            failureThreshold: 3  
          volumeMounts:  
            - name: logs  
              mountPath: {{ .Values.persistence.logDir.path }}  
            - name: config  
              mountPath: {{ .Values.persistence.config.path }}  
              subPath: config.yaml  
            {{- if .Values.tls.enabled }}  
            - name: tls  
              mountPath: /app/tls
              readOnly: true  
            {{- end }}  
          resources:  
            {{- toYaml .Values.resources | nindent 12 }}  
      volumes:  
        - name: logs  
          {{- if .Values.persistence.enabled }}  
          persistentVolumeClaim:  
            claimName: {{ include "cursus.fullname" . }}-logs  
          {{- else }}  
          emptyDir: {}  
          {{- end }}  
        - name: config  
          configMap:  
            name: {{ include "cursus.fullname" . }}-config  
        {{- if .Values.tls.enabled }}  
        - name: tls  
          secret:  
            secretName: {{ .Values.tls.secretName }}  
            items:  
              - key: tls.crt  
                path: cert.pem  
              - key: tls.key  
                path: key.pem  
        {{- end }}  
      {{- with .Values.nodeSelector }}  
      nodeSelector:  
        {{- toYaml . | nindent 8 }}  
      {{- end }}  
      {{- with .Values.affinity }}  
      affinity:  
        {{- toYaml . | nindent 8 }}  
      {{- end }}  
      {{- with .Values.tolerations }}  
      tolerations:  
        {{- toYaml . | nindent 8 }}  
      {{- end }}
